<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmad Abdullah — Graphic & Web Designer</title>
    <meta
      name="description"
      content="Ahmad Abdullah — graphic and web designer. Logos, brand identities, product labels, posters, social campaigns, canvas art and responsive websites, made in Photoshop, Illustrator and code."
    />
    <meta name="theme-color" content="#1d1d1f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- dark workspace by default; apply a saved choice before first paint -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
