<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmad Abdullah — Graphic & Web Designer</title>
    <meta
      name="description"
      content="Ahmad Abdullah — graphic and web designer in Riyadh, KSA. Logos, brand identities, product labels, posters, social campaigns, canvas art and responsive websites, made in Photoshop, Illustrator and code. Available in English and Arabic."
    />
    <meta name="theme-color" content="#1d1d1f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://www.designdynamo.art/" />

    <!-- link previews (WhatsApp, LinkedIn, Facebook, iMessage, Slack…).
         Image: public/og-image.jpg, 1200×630, absolute URL as crawlers need. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Design Dynamo" />
    <meta property="og:title" content="Ahmad Abdullah — Graphic & Web Designer in Riyadh" />
    <meta property="og:description" content="Logos, brand identities, packaging, posters, social media and responsive websites. Portfolio, services and pricing — in English and Arabic." />
    <meta property="og:url" content="https://www.designdynamo.art/" />
    <meta property="og:image" content="https://www.designdynamo.art/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.designdynamo.art/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ahmad Abdullah, graphic and web designer in Riyadh — designdynamo.art" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ahmad Abdullah — Graphic & Web Designer in Riyadh" />
    <meta name="twitter:description" content="Logos, brand identities, packaging, posters, social media and responsive websites. Portfolio, services and pricing — in English and Arabic." />
    <meta name="twitter:image" content="https://www.designdynamo.art/og-image.jpg" />
    <meta name="twitter:image:alt" content="Ahmad Abdullah, graphic and web designer in Riyadh — designdynamo.art" />
    <!-- dark workspace by default; apply saved choices (theme, language and
         reading direction) before first paint so nothing flips on load -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (error) {}
      try {
        var lang = new URLSearchParams(location.search).get("lang");
        if (lang !== "ar" && lang !== "en") lang = localStorage.getItem("lang");
        if (lang !== "ar" && lang !== "en") lang = /^ar/i.test(navigator.language || "") ? "ar" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
